[project]
name = "ticketing-backend"
version = "0.1.0"
description = "Ticketing portal backend (FastAPI + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "google-cloud-storage>=2.18",
    "google-auth>=2.35",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
ignore = [
    # Shebang-missing fires repo-wide on Windows, which doesn't track the
    # executable bit; git's core.fileMode is also set to false for this repo.
    "EXE002",
    # FastAPI's `Depends(...)` default-argument pattern is idiomatic, not a
    # mutable-default bug; every router/dependency in this app uses it.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A single event loop for the whole session: app.db builds one global async
# engine at import time, and asyncpg connections can't be reused across
# event loops, so per-test loops would break the pooled connection.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
