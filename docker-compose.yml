services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    # No published port: only the api/worker reach it, over the compose
    # network (dev credentials never exposed on the host).
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # No published port, as for db.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
      # Bind-mount file events don't reach the container on Docker Desktop,
      # so uvicorn --reload (watchfiles) polls instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
      # docs/demo-data/tickets.json feeds the SEED_DEMO seed (read-only).
      - ./docs/demo-data:/demo-data:ro
    ports:
      - "8000:8000"
    # Healthy only once migrations + seed have run and uvicorn answers, so
    # the worker never sweeps a database without tables.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  attachments_data:
